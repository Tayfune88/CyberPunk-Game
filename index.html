<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON-GHOST: Protocol Zero</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0c;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), 0 0 40px rgba(255, 0, 255, 0.2);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #0d0e15 0%, #1a1b26 100%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-element {
            text-shadow: 0 0 5px #0ff;
        }

        .health-bar-container {
            width: 200px;
            height: 15px;
            background-color: #222;
            border: 1px solid #0ff;
            margin-bottom: 5px;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #0ff;
            transition: width 0.1s;
        }

        .energy-bar-container {
            width: 150px;
            height: 10px;
            background-color: #222;
            border: 1px solid #f0f;
        }

        #energy-bar {
            width: 100%;
            height: 100%;
            background-color: #f0f;
            transition: width 0.1s;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #aaa;
            text-shadow: none;
        }

        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #game-over-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #f00;
            text-shadow: 0 0 10px #f00, 0 0 20px #f00;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        #restart-btn:hover {
            background-color: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px #0ff;
        }

    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div>
                <div class="hud-element" style="font-size: 14px; margin-bottom: 5px;">UNIT 7 [HP]</div>
                <div class="health-bar-container"><div id="health-bar"></div></div>
                <div class="hud-element" style="font-size: 12px; margin-bottom: 2px; margin-top: 10px; color: #f0f; text-shadow: 0 0 5px #f0f;">DASH / WALLRUN [EN]</div>
                <div class="energy-bar-container"><div id="energy-bar"></div></div>
            </div>
            <div>
                <div class="hud-element" style="font-size: 24px;">SCORE: <span id="score">0</span></div>
            </div>
        </div>
        <div id="controls">
            A/D or Left/Right: Move<br>
            W or Up: Jump<br>
            Jump towards Wall: Wall Slide/Run<br>
            Shift: Phase-Dash<br>
            Left Click: Katana (Melee)<br>
            Right Click: Railgun (Ranged)
        </div>
        <div id="game-over-screen">
            <h1>SYSTEM FAILURE</h1>
            <p style="font-size: 20px; margin-bottom: 30px;">UNIT 7 OFFLINE</p>
            <button id="restart-btn">REBOOT PROTOCOL</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
